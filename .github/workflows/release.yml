name: 构建与发布

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-ci:
    name: 验证发布提交的 CI
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - id: commit
        name: 固定本轮构建提交
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: tag 必须来自 main 且同一提交 CI 已通过
        if: github.ref_type == 'tag'
        run: node scripts/verify-release-ci.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  # 四个平台的步骤在 package.yml 里，夜间回归调用的是同一份。
  build:
    name: 桌面安装包
    needs: verify-ci
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ needs.verify-ci.outputs.commit }}

  web:
    name: Web 发行包
    needs: verify-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MYDATADEV_RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-ci.outputs.commit }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 安装前端依赖
        run: npm ci
        working-directory: frontend

      - name: 构建 Web 发行包
        run: node scripts/build-web-bundle.mjs

      - name: Web 发行包烟测
        shell: bash
        run: |
          set -euo pipefail
          jar=$(find release-assets -name '*-web.jar' -type f -print -quit)
          test -n "$jar"

          workdir=$(mktemp -d "$RUNNER_TEMP/mydatadev-web.XXXXXX")
          cd "$workdir"
          # 不再传 DB_ADMIN_CRYPTO_KEY：主密钥改为系统托管之后，带着这个变量启动会被直接拒绝，
          # 发行包首次启动本就该在工作目录下自己生成 ./secrets/mydatadev-master.key —— 烟测跑的
          # 正是「新装一台机器」这条路。
          DB_ADMIN_WEB_PASSWORD=smoke-password-at-least-12 \
            java -jar "$GITHUB_WORKSPACE/$jar" \
            --spring.profiles.active=web --server.port=8099 > server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8099/actuator/health > /dev/null 2>&1; then break; fi
            kill -0 "$pid" 2>/dev/null || { cat server.log; exit 1; }
            sleep 2
          done

          # 同源提供 UI 与 API 是 Web 发行包的全部意义，两条路径都要真的可用。
          curl -fsS http://127.0.0.1:8099/ | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/api/connections)" = "401"
          auth_status=$(curl -fsS -c cookies.txt http://127.0.0.1:8099/api/auth/status)
          csrf_token=$(printf '%s' "$auth_status" | jq -r '.csrfToken')
          curl -fsS -b cookies.txt -c cookies.txt -H 'Content-Type: application/json' \
            -H "X-XSRF-TOKEN: $csrf_token" \
            --data '{"username":"admin","password":"smoke-password-at-least-12"}' \
            http://127.0.0.1:8099/api/auth/login > /dev/null
          curl -fsS -b cookies.txt http://127.0.0.1:8099/api/connections > /dev/null
          # 元数据库控制台在发行包中必须是关闭的。
          test "$(curl -s -b cookies.txt -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/h2-console)" = "404"

      # 依赖清单扫的是真正要发出去的 JAR（BOOT-INF/lib 里实际打进去的 Java 依赖），外加前端与桌面端的
      # lockfile —— 前端依赖被打包压缩进 JAR 之后已经认不出来，只能从 lockfile 取。以后某个依赖爆出
      # 漏洞，查这份清单就知道哪个版本的发行包受影响。桌面安装包里的后端与 Web JAR 是同一套依赖。
      # 清单不含桌面安装包自带的 Electron（lockfile 里是开发依赖，扫描器默认跳过）与 jlink 生成的 Java
      # 运行时。刻意不打开「包含开发依赖」：那会把 vite、typescript 这些不发出去的构建工具一起列进来，
      # 一份夸大的清单比一份写明了边界的清单更误导。边界写在 docs/desktop.md 与发行说明里。
      - name: 整理 SBOM 扫描输入
        id: sbom
        shell: bash
        run: |
          set -euo pipefail
          jar=$(find release-assets -name '*-web.jar' -type f -print -quit)
          test -n "$jar"
          input="$RUNNER_TEMP/sbom-input"
          mkdir -p "$input/frontend" "$input/desktop"
          cp "$jar" "$input/"
          cp frontend/package-lock.json "$input/frontend/"
          cp desktop/package-lock.json "$input/desktop/"
          echo "input=$input" >> "$GITHUB_OUTPUT"
          echo "output=${jar%-web.jar}-sbom.spdx.json" >> "$GITHUB_OUTPUT"

      # 第三方 action 固定到提交而不是可移动的 tag：它和要发出去的 Web JAR 在同一个作业里，能改写
      # release-assets/，而 release 作业随后会给这些文件签发来源证明 —— tag 一旦被改指向，证明就会替被改过的
      # 文件背书。升级由 Dependabot 提 PR（它认得行尾的版本注释）。
      - name: 生成 SBOM（依赖清单）
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ${{ steps.sbom.outputs.input }}
          format: spdx-json
          output-file: ${{ steps.sbom.outputs.output }}
          # 只生成文件，随 Web 发行包一起交给 release 作业上传，不让 action 自己往 Release 或 artifact 里放。
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/upload-artifact@v7
        with:
          name: mydatadev-web
          path: release-assets/*
          if-no-files-found: error

  release:
    name: 创建 GitHub Release
    if: github.ref_type == 'tag'
    needs: [verify-ci, build, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      # 构建来源证明要向 GitHub 的 OIDC 换一个短期签名身份，并把证明写进仓库的 attestations。
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-ci.outputs.commit }}

      # 发行说明由 scripts/release-notes.mjs 生成；版本与其他作业保持一致，
      # 不依赖 runner 自带的 Node 版本。
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 发布前再次确认 CI 结果
        run: node scripts/verify-release-ci.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/download-artifact@v8
        with:
          pattern: mydatadev-*
          path: release-assets
          merge-multiple: true

      - name: 生成 SHA-256 校验文件
        working-directory: release-assets
        run: sha256sum MyDataDev-* > SHA256SUMS.txt

      # 构建来源证明：由 GitHub 签发，写明每个文件出自哪个仓库、哪个提交、哪次工作流运行。
      # SHA256SUMS 防得住下载损坏，防不住替换 —— 它和安装包放在同一个地方，能换掉一个就能换掉两个；
      # 证明的签名不在 Release 里，用户可以用 gh attestation verify 独立核对。放在发布之前：签发失败就不发布。
      - name: 签发构建来源证明
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-assets/MyDataDev-*

      - name: 发布安装包
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            # 版本说明从 CHANGELOG 抽取，抽不到会直接失败 —— 宁可不发布，
            # 也不要发出一份挂着上个版本内容的说明（0.5.0 就这么中过一次）。
            node scripts/release-notes.mjs "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
            gh release create "$RELEASE_TAG" release-assets/* \
              --generate-notes \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --title "MyDataDev $RELEASE_TAG"
          fi
