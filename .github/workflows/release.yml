name: 构建与发布

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-ci:
    name: 验证发布提交的 CI
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - id: commit
        name: 固定本轮构建提交
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: tag 必须来自 main 且同一提交 CI 已通过
        if: github.ref_type == 'tag'
        run: node scripts/verify-release-ci.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    name: ${{ matrix.name }}
    needs: verify-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            platform: darwin
            arch: arm64
          - name: macOS x64
            os: macos-15-intel
            platform: darwin
            arch: x64
          - name: Windows x64
            os: windows-2025
            platform: win32
            arch: x64
          - name: Linux x64
            os: ubuntu-24.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      MYDATADEV_RELEASE_PLATFORM: ${{ matrix.platform }}
      MYDATADEV_RELEASE_ARCH: ${{ matrix.arch }}
      MYDATADEV_RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-ci.outputs.commit }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 安装前端依赖
        run: npm ci
        working-directory: frontend

      - name: 安装桌面端依赖
        run: npm ci
        working-directory: desktop

      - name: 安装 Linux 打包工具
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm xvfb

      # tag 构建由 verify-ci 校验 main 归属及同一 SHA 的必需检查；这里仅构建和验证产物启动。
      - name: 生成原生安装包
        run: npm run make
        working-directory: desktop

      - name: macOS ad-hoc 签名结构校验
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(find desktop/out/make -name '*.dmg' -type f -print -quit)
          test -n "$dmg"

          mount_dir=$(mktemp -d "$RUNNER_TEMP/mydatadev-dmg.XXXXXX")
          cleanup() {
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
            rmdir "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg" >/dev/null
          app="$mount_dir/MyDataDev.app"
          codesign --verify --deep --strict --verbose=2 "$app"

          signature=$(codesign -dv --verbose=4 "$app" 2>&1)
          grep -Fq 'Identifier=com.tanner.mydatadev' <<<"$signature"
          grep -Fq 'Signature=adhoc' <<<"$signature"
          grep -Fq 'Sealed Resources version=2' <<<"$signature"

      - name: macOS 安装前烟测
        if: runner.os == 'macOS'
        shell: bash
        run: |
          executable=$(find desktop/out -path '*/MyDataDev.app/Contents/MacOS/MyDataDev' -type f -print -quit)
          test -n "$executable"
          MYDATADEV_DESKTOP_HOME="$RUNNER_TEMP/mydatadev-smoke" "$executable" --smoke-test

      - name: Windows 安装前烟测
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $executable = Get-ChildItem desktop/out -Recurse -Filter MyDataDev.exe |
            Where-Object { $_.FullName -match 'win32-x64' } |
            Select-Object -First 1
          if (-not $executable) { throw '未找到 MyDataDev.exe' }
          $env:MYDATADEV_DESKTOP_HOME = Join-Path $env:RUNNER_TEMP 'mydatadev-smoke'
          & $executable.FullName --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Linux 安装前烟测
        if: runner.os == 'Linux'
        shell: bash
        run: |
          executable=$(find desktop/out -path '*/MyDataDev-linux-x64/MyDataDev' -type f -print -quit)
          test -n "$executable"
          MYDATADEV_DESKTOP_HOME="$RUNNER_TEMP/mydatadev-smoke" xvfb-run -a "$executable" --no-sandbox --smoke-test

      - name: 整理安装包
        run: npm run collect:artifacts
        working-directory: desktop

      - uses: actions/upload-artifact@v7
        with:
          name: mydatadev-${{ matrix.platform }}-${{ matrix.arch }}
          path: desktop/release-assets/*
          if-no-files-found: error

  web:
    name: Web 发行包
    needs: verify-ci
    runs-on: ubuntu-24.04
    env:
      MYDATADEV_RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-ci.outputs.commit }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 安装前端依赖
        run: npm ci
        working-directory: frontend

      - name: 构建 Web 发行包
        run: node scripts/build-web-bundle.mjs

      - name: Web 发行包烟测
        shell: bash
        run: |
          set -euo pipefail
          jar=$(find release-assets -name '*-web.jar' -type f -print -quit)
          test -n "$jar"

          workdir=$(mktemp -d "$RUNNER_TEMP/mydatadev-web.XXXXXX")
          cd "$workdir"
          # 不再传 DB_ADMIN_CRYPTO_KEY：主密钥改为系统托管之后，带着这个变量启动会被直接拒绝，
          # 发行包首次启动本就该在工作目录下自己生成 ./secrets/mydatadev-master.key —— 烟测跑的
          # 正是「新装一台机器」这条路。
          DB_ADMIN_WEB_PASSWORD=smoke-password-at-least-12 \
            java -jar "$GITHUB_WORKSPACE/$jar" \
            --spring.profiles.active=web --server.port=8099 > server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8099/actuator/health > /dev/null 2>&1; then break; fi
            kill -0 "$pid" 2>/dev/null || { cat server.log; exit 1; }
            sleep 2
          done

          # 同源提供 UI 与 API 是 Web 发行包的全部意义，两条路径都要真的可用。
          curl -fsS http://127.0.0.1:8099/ | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/api/connections)" = "401"
          auth_status=$(curl -fsS -c cookies.txt http://127.0.0.1:8099/api/auth/status)
          csrf_token=$(printf '%s' "$auth_status" | jq -r '.csrfToken')
          curl -fsS -b cookies.txt -c cookies.txt -H 'Content-Type: application/json' \
            -H "X-XSRF-TOKEN: $csrf_token" \
            --data '{"username":"admin","password":"smoke-password-at-least-12"}' \
            http://127.0.0.1:8099/api/auth/login > /dev/null
          curl -fsS -b cookies.txt http://127.0.0.1:8099/api/connections > /dev/null
          # 元数据库控制台在发行包中必须是关闭的。
          test "$(curl -s -b cookies.txt -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/h2-console)" = "404"

      - uses: actions/upload-artifact@v7
        with:
          name: mydatadev-web
          path: release-assets/*
          if-no-files-found: error

  release:
    name: 创建 GitHub Release
    if: github.ref_type == 'tag'
    needs: [verify-ci, build, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-ci.outputs.commit }}

      # 发行说明由 scripts/release-notes.mjs 生成；版本与其他作业保持一致，
      # 不依赖 runner 自带的 Node 版本。
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 发布前再次确认 CI 结果
        run: node scripts/verify-release-ci.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/download-artifact@v8
        with:
          pattern: mydatadev-*
          path: release-assets
          merge-multiple: true

      - name: 生成 SHA-256 校验文件
        working-directory: release-assets
        run: sha256sum MyDataDev-* > SHA256SUMS.txt

      - name: 发布安装包
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            # 版本说明从 CHANGELOG 抽取，抽不到会直接失败 —— 宁可不发布，
            # 也不要发出一份挂着上个版本内容的说明（0.5.0 就这么中过一次）。
            node scripts/release-notes.mjs "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
            gh release create "$RELEASE_TAG" release-assets/* \
              --generate-notes \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --title "MyDataDev $RELEASE_TAG"
          fi
