name: 持续集成

# 发布工作流只在打 tag 时跑，也就是说合并之前没有任何东西在执行 AGENTS.md 里那句
# 「提交前至少运行 mvn test 与 npm run build」。这个工作流补的就是这一段：每次推送和
# 每个 PR 都跑一遍，跑的命令与那份约定逐字一致。
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR 上连着推几次时，只留最后一次 —— 前面几次的结论已经没人看了。main 上则每个提交都要跑完：
  # 发布检查按 SHA 找这一轮的结论，被取消的提交永远打不了 tag。按 SHA 分组而不只是关掉取消，
  # 是因为同一组里只保留一个排队中的运行，第三次推送照样会把第二次挤掉。
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  database-compatibility:
    name: MySQL 与 PostgreSQL 真实回归
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-test-password
          MYSQL_DATABASE: mydatadev_test
          MYSQL_USER: mydatadev
          MYSQL_PASSWORD: ci-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mydatadev_test
          POSTGRES_USER: mydatadev
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mydatadev -d mydatadev_test"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 安装真实备份恢复客户端
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client postgresql-client-16

      - name: 验证数据编辑、事务、DDL、导出及备份恢复往返
        working-directory: backend
        run: mvn test --batch-mode '-Dtest=Database*CompatibilityTest'
        env:
          # 点名这两家，漏配任何一个都直接失败而不是静默跳过。另外三家各有自己的作业 ——
          # 每家一个作业，一家的问题就不会把另一家的结论一起遮掉。
          TEST_REQUIRED_DATABASES: mysql,postgresql
          TEST_NATIVE_TOOLS: 'true'
          TEST_MYSQLDUMP_PATH: /usr/bin/mysqldump
          TEST_MYSQL_PATH: /usr/bin/mysql
          TEST_PG_DUMP_PATH: /usr/lib/postgresql/16/bin/pg_dump
          TEST_PG_RESTORE_PATH: /usr/lib/postgresql/16/bin/pg_restore
          TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/mydatadev_test?useSSL=false&allowPublicKeyRetrieval=true
          TEST_MYSQL_USER: mydatadev
          TEST_MYSQL_PASSWORD: ci-test-password
          TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/mydatadev_test
          TEST_POSTGRES_USER: mydatadev
          TEST_POSTGRES_PASSWORD: ci-test-password
      - name: 保存真实数据库回归报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: database-compatibility-reports
          path: |
            backend/target/surefire-reports/*Database*CompatibilityTest*

  mariadb-compatibility:
    name: MariaDB 真实回归
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # 单独一个作业，只为了装 mariadb-client：它与 mysql-client 在 apt 层面互斥（两者都提供
    # virtual-mysql-client），装不到同一个 runner 上。而拿 mysqldump 8.4 去打 MariaDB 11
    # 会因为版本探测与 information_schema 差异失败，用一个跑不通的组合证明不了兼容性。
    # MariaDB 值得单独测：它和 MySQL 是两个方言实现，注册表里 MariaDB 排在 MySQL 之前，
    # 且 MySqlDialect.supports 显式把 mariadb 让出去 —— 这种顺序敏感的匹配只有实库跑得出来。
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-test-password
          MARIADB_DATABASE: mydatadev_test
          MARIADB_USER: mydatadev
          MARIADB_PASSWORD: ci-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 安装 MariaDB 客户端
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client
      - name: 验证数据编辑、事务、DDL、导出及备份恢复往返
        working-directory: backend
        run: mvn test --batch-mode '-Dtest=Database*CompatibilityTest'
        env:
          TEST_REQUIRED_DATABASES: mariadb
          TEST_NATIVE_TOOLS: 'true'
          TEST_MARIADB_URL: jdbc:mariadb://127.0.0.1:3306/mydatadev_test
          TEST_MARIADB_USER: mydatadev
          TEST_MARIADB_PASSWORD: ci-test-password
          TEST_MARIADB_MYSQLDUMP_PATH: /usr/bin/mariadb-dump
          TEST_MARIADB_MYSQL_PATH: /usr/bin/mariadb
      - name: 保存 MariaDB 回归报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mariadb-compatibility-reports
          path: |
            backend/target/surefire-reports/*Database*CompatibilityTest*

  sqlserver-compatibility:
    name: SQL Server 真实回归
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Ci-Test-Password1
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ci-Test-Password1 -C -Q 'SELECT 1'"
          --health-interval=10s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 建 SQL Server 测试库
        run: |
          docker exec "$(docker ps --filter ancestor=mcr.microsoft.com/mssql/server:2022-latest --format '{{.ID}}')" \
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ci-Test-Password1' -C \
            -Q "IF DB_ID('mydatadev_test') IS NULL CREATE DATABASE mydatadev_test"
      - name: 验证数据编辑、事务、DDL、导出及备份恢复往返
        working-directory: backend
        run: mvn test --batch-mode '-Dtest=Database*CompatibilityTest'
        env:
          TEST_REQUIRED_DATABASES: sqlserver
          # SQL Server 方言的 nativeBackupMethods 是空的，只有 SQL 逻辑备份那条路。
          TEST_SQLSERVER_URL: jdbc:sqlserver://127.0.0.1:1433;databaseName=mydatadev_test;encrypt=true;trustServerCertificate=true
          TEST_SQLSERVER_USER: sa
          TEST_SQLSERVER_PASSWORD: Ci-Test-Password1
      - name: 保存 SQL Server 回归报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sqlserver-compatibility-reports
          path: backend/target/surefire-reports/*Database*CompatibilityTest*

  oracle-compatibility:
    name: Oracle 真实回归
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: ci-test-password
          APP_USER: mydatadev
          APP_USER_PASSWORD: ci-test-password
        ports:
          - 1521:1521
        options: >-
          --health-cmd="healthcheck.sh"
          --health-interval=15s --health-timeout=10s --health-retries=40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 验证数据编辑、事务、DDL、导出及备份恢复往返
        working-directory: backend
        run: mvn test --batch-mode '-Dtest=Database*CompatibilityTest'
        env:
          TEST_REQUIRED_DATABASES: oracle
          # Oracle 的 exp / imp 客户端不在 runner 上，只有 SQL 逻辑备份那条路。
          TEST_ORACLE_URL: jdbc:oracle:thin:@//127.0.0.1:1521/FREEPDB1
          TEST_ORACLE_USER: mydatadev
          TEST_ORACLE_PASSWORD: ci-test-password
      - name: 保存 Oracle 回归报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oracle-compatibility-reports
          path: backend/target/surefire-reports/*Database*CompatibilityTest*

  ui-smoke:
    name: Web 发行包浏览器回归
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装前端依赖
        run: npm ci
        working-directory: frontend
      - name: 构建完整 Web 发行包
        run: node scripts/build-web-bundle.mjs
      - name: 真实浏览器操作与数据库结果核对
        run: CHROME_PATH="$(command -v google-chrome)" node scripts/ui-smoke.mjs --serve --auth --work "$RUNNER_TEMP/mydatadev-smoke" --shots ./ui-shots
      # 截图、布局违规清单和服务日志都留下：布局审计失败时要看的是 layout-violations.json
      # 那份完整清单（日志里每条规则只举一个例子），而「好不好看」仍然只能靠人翻截图。
      - name: 保存浏览器验收截图、布局违规清单与服务日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-ui-smoke
          path: |
            ui-shots/
            ${{ runner.temp }}/mydatadev-smoke/server.log

  backend:
    name: 后端测试
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 运行后端测试
        run: mvn test --batch-mode
        working-directory: backend

  frontend:
    name: 前端测试与构建
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        run: npm ci
        working-directory: frontend

      - name: 运行前端测试
        run: npm test
        working-directory: frontend

      - name: 验证发布检查脚本与 CI Gate 清单
        run: node --test scripts/verify-release-ci.test.mjs scripts/ci-gate.test.mjs

      # 构建同时会跑 check-build-budget.mjs：首屏资源数与懒加载链的 gzip 体积都有硬上限，
      # 把重型模块拉进首屏会在这里失败，而不是等到发版才发现。
      - name: 构建前端（含体积预算校验）
        run: npm run build
        working-directory: frontend

  desktop:
    name: 桌面端测试与类型检查
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: 安装桌面端依赖
        run: npm ci
        working-directory: desktop

      - name: 运行桌面端测试
        run: npm test
        working-directory: desktop

      # 主进程构建兼作类型检查；不跑 npm run make，原生打包要签名和各平台环境，那是发布工作流的事。
      - name: 构建桌面端主进程
        run: npm run build:main
        working-directory: desktop

  upgrade:
    name: 旧版本升级回归
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # 只拿最新发行版：用户升级绝大多数是从上一版来的。不带 tag 时 gh 取的就是 Latest。
      - name: 下载最新发行版的 Web JAR
        run: gh release download --pattern '*-web.jar' --dir "$RUNNER_TEMP/previous"
        env:
          GH_TOKEN: ${{ github.token }}

      # 只要后端 JAR：这里测的是数据有没有跟过来，界面归浏览器回归管，省掉一次前端构建。
      - name: 构建当前后端 JAR
        run: mvn package --batch-mode -DskipTests
        working-directory: backend

      - name: 旧版本的数据目录交给当前版本打开
        run: |
          node scripts/upgrade-smoke.mjs \
            --from "$(ls "$RUNNER_TEMP"/previous/*-web.jar)" \
            --to "$(ls backend/target/web-db-admin-*.jar)" \
            --work "$RUNNER_TEMP/mydatadev-upgrade"

      - name: 保存升级前后的服务日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upgrade-smoke-logs
          path: ${{ runner.temp }}/mydatadev-upgrade/*.log

  # 分支保护与发布检查只认这一个作业，不再逐个点名上面的作业：新增、改名或拆分作业时不用
  # 同步改 GitHub 设置。代价是这里的 needs 必须列全 —— 漏掉的作业等于不受保护，
  # scripts/ci-gate.test.mjs 拦的就是这种遗漏。
  gate:
    name: CI Gate
    # 用 always() 而不是 !cancelled()：整轮被取消时 Gate 如果被跳过，GitHub 会把跳过的必需
    # 检查当成通过。这里必须真跑一次，并判失败。
    if: always()
    needs:
      - database-compatibility
      - mariadb-compatibility
      - sqlserver-compatibility
      - oracle-compatibility
      - ui-smoke
      - backend
      - frontend
      - desktop
      - upgrade
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 所有作业必须实际成功
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # 跳过同样不算通过：现在没有按路径跳过的作业，出现 skipped 只可能是上游出了问题。
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)：\(.value.result)"' <<<"$NEEDS")
          if [ -n "$failed" ]; then
            printf '以下作业未成功：\n%s\n' "$failed"
            exit 1
          fi
          echo "全部 $(jq length <<<"$NEEDS") 个作业成功"
