name: 持续集成

# 发布工作流只在打 tag 时跑，也就是说合并之前没有任何东西在执行 AGENTS.md 里那句
# 「提交前至少运行 mvn test 与 npm run build」。这个工作流补的就是这一段：每次推送和
# 每个 PR 都跑一遍，跑的命令与那份约定逐字一致。
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 同一个分支上连着推几次时，只留最后一次 —— 前面几次的结论已经没人看了。
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-compatibility:
    name: 五种数据库真实回归
    runs-on: ubuntu-24.04
    # Oracle 容器起得慢（要建 PDB 与用户），单它就可能占掉五六分钟，所以上限比原来放宽。
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-test-password
          MYSQL_DATABASE: mydatadev_test
          MYSQL_USER: mydatadev
          MYSQL_PASSWORD: ci-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mydatadev_test
          POSTGRES_USER: mydatadev
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mydatadev -d mydatadev_test"
          --health-interval=10s --health-timeout=5s --health-retries=12
      # MariaDB 与 MySQL 是两个方言实现（DialectRegistry 里 MariaDB 排在 MySQL 之前，
      # 且 MySqlDialect.supports 显式把 mariadb 让出去），差异只有真实库跑得出来。
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-test-password
          MARIADB_DATABASE: mydatadev_test
          MARIADB_USER: mydatadev
          MARIADB_PASSWORD: ci-test-password
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
      # SQL Server 的方言差异最大：不支持列注释、分页走 OFFSET/FETCH、TIMESTAMP 是行版本戳、
      # 能力矩阵里表设计为 false。镜像不会自动建库，下面用 sqlcmd 建。
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Ci-Test-Password1
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ci-Test-Password1 -C -Q 'SELECT 1'"
          --health-interval=10s --health-timeout=5s --health-retries=30
      # Oracle 特有的约定最多：未加引号的标识符折成大写、空串等于 NULL、DBMS_OUTPUT、
      # ALL_ERRORS 里的编译错误、冲突策略要整条换成 MERGE。
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: ci-test-password
          APP_USER: mydatadev
          APP_USER_PASSWORD: ci-test-password
        ports:
          - 1521:1521
        options: >-
          --health-cmd="healthcheck.sh"
          --health-interval=15s --health-timeout=10s --health-retries=40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 安装真实备份恢复客户端
        run: |
          sudo apt-get update
          # MariaDB 用它自己的客户端：mysqldump 8.4 打到 MariaDB 11 上会因为版本探测与
          # information_schema 差异失败，用一个跑不通的组合证明不了兼容性。
          sudo apt-get install -y mysql-client postgresql-client-16 mariadb-client

      - name: 建 SQL Server 测试库
        run: |
          docker exec "$(docker ps --filter ancestor=mcr.microsoft.com/mssql/server:2022-latest --format '{{.ID}}')" \
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ci-Test-Password1' -C \
            -Q "IF DB_ID('mydatadev_test') IS NULL CREATE DATABASE mydatadev_test"

      - name: 验证数据编辑、事务、DDL、导出及备份恢复往返（五种数据库）
        working-directory: backend
        run: mvn test --batch-mode -Dtest=DatabaseCompatibilityTest,DatabaseBackupCompatibilityTest
        env:
          TEST_DATABASES_REQUIRED: 'true'
          TEST_NATIVE_TOOLS: 'true'
          TEST_MYSQLDUMP_PATH: /usr/bin/mysqldump
          TEST_MYSQL_PATH: /usr/bin/mysql
          TEST_PG_DUMP_PATH: /usr/lib/postgresql/16/bin/pg_dump
          TEST_PG_RESTORE_PATH: /usr/lib/postgresql/16/bin/pg_restore
          TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/mydatadev_test?useSSL=false&allowPublicKeyRetrieval=true
          TEST_MYSQL_USER: mydatadev
          TEST_MYSQL_PASSWORD: ci-test-password
          TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/mydatadev_test
          TEST_POSTGRES_USER: mydatadev
          TEST_POSTGRES_PASSWORD: ci-test-password
          TEST_MARIADB_URL: jdbc:mariadb://127.0.0.1:3307/mydatadev_test
          TEST_MARIADB_USER: mydatadev
          TEST_MARIADB_PASSWORD: ci-test-password
          TEST_MARIADB_MYSQLDUMP_PATH: /usr/bin/mariadb-dump
          TEST_MARIADB_MYSQL_PATH: /usr/bin/mariadb
          # SQL Server 18 版驱动默认要求加密，测试容器是自签证书，所以显式信任。
          TEST_SQLSERVER_URL: jdbc:sqlserver://127.0.0.1:1433;databaseName=mydatadev_test;encrypt=true;trustServerCertificate=true
          TEST_SQLSERVER_USER: sa
          TEST_SQLSERVER_PASSWORD: Ci-Test-Password1
          TEST_ORACLE_URL: jdbc:oracle:thin:@//127.0.0.1:1521/FREEPDB1
          TEST_ORACLE_USER: mydatadev
          TEST_ORACLE_PASSWORD: ci-test-password
      - name: 保存真实数据库回归报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: database-compatibility-reports
          path: |
            backend/target/surefire-reports/*DatabaseCompatibilityTest*
            backend/target/surefire-reports/*DatabaseBackupCompatibilityTest*

  ui-smoke:
    name: Web 发行包浏览器回归
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装前端依赖
        run: npm ci
        working-directory: frontend
      - name: 构建完整 Web 发行包
        run: node scripts/build-web-bundle.mjs
      - name: 真实浏览器操作与数据库结果核对
        run: CHROME_PATH="$(command -v google-chrome)" node scripts/ui-smoke.mjs --serve --auth --work "$RUNNER_TEMP/mydatadev-smoke" --shots ./ui-shots
      # 截图、布局违规清单和服务日志都留下：布局审计失败时要看的是 layout-violations.json
      # 那份完整清单（日志里每条规则只举一个例子），而「好不好看」仍然只能靠人翻截图。
      - name: 保存浏览器验收截图、布局违规清单与服务日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-ui-smoke
          path: |
            ui-shots/
            ${{ runner.temp }}/mydatadev-smoke/server.log

  backend:
    name: 后端测试
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 运行后端测试
        run: mvn test --batch-mode
        working-directory: backend

  frontend:
    name: 前端测试与构建
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        run: npm ci
        working-directory: frontend

      - name: 运行前端测试
        run: npm test
        working-directory: frontend

      # 构建同时会跑 check-build-budget.mjs：首屏资源数与懒加载链的 gzip 体积都有硬上限，
      # 把重型模块拉进首屏会在这里失败，而不是等到发版才发现。
      - name: 构建前端（含体积预算校验）
        run: npm run build
        working-directory: frontend

  desktop:
    name: 桌面端测试与类型检查
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: 安装桌面端依赖
        run: npm ci
        working-directory: desktop

      - name: 运行桌面端测试
        run: npm test
        working-directory: desktop

      # 主进程构建兼作类型检查；不跑 npm run make，原生打包要签名和各平台环境，那是发布工作流的事。
      - name: 构建桌面端主进程
        run: npm run build:main
        working-directory: desktop
