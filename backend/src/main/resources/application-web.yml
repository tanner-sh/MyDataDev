# Web 发行包（mydatadev-web.jar）使用的运行配置，通过
# --spring.profiles.active=web 激活。默认配置面向本地开发，这里只覆盖
# 独立部署时必须收紧或补齐的部分，数据目录仍相对于 JAR 的工作目录。
server:
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: ${APP_AUTH_SESSION_TIMEOUT:8h}
      cookie:
        http-only: true
        same-site: lax
        secure: ${APP_AUTH_COOKIE_SECURE:false}

spring:
  h2:
    console:
      # 元数据库控制台可以绕过应用的用户权限，发行包一律关闭。
      enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 30s
  web:
    resources:
      cache:
        cachecontrol:
          # index.html 每次回源校验，指纹化的 /assets/** 由 WebConfig 单独设置长缓存。
          max-age: 0
          must-revalidate: true

app:
  auth:
    mode: ${APP_AUTH_MODE:LOCAL}
    # 以下两项只在 app_user 为空时初始化第一个 ADMIN，后续账号由管理界面维护。
    username: ${DB_ADMIN_WEB_USERNAME:admin}
    password: ${DB_ADMIN_WEB_PASSWORD:}
    cookie-secure: ${APP_AUTH_COOKIE_SECURE:false}
    max-failed-attempts: ${APP_AUTH_MAX_FAILED_ATTEMPTS:5}
    lock-seconds: ${APP_AUTH_LOCK_SECONDS:30}
    oidc:
      issuer-uri: ${APP_AUTH_OIDC_ISSUER_URI:}
      client-id: ${APP_AUTH_OIDC_CLIENT_ID:}
      client-secret: ${APP_AUTH_OIDC_CLIENT_SECRET:}
      scopes: ${APP_AUTH_OIDC_SCOPES:openid,profile,email}
      username-claim: ${APP_AUTH_OIDC_USERNAME_CLAIM:preferred_username}
      display-name-claim: ${APP_AUTH_OIDC_DISPLAY_NAME_CLAIM:name}
      groups-claim: ${APP_AUTH_OIDC_GROUPS_CLAIM:groups}
      admin-groups: ${APP_AUTH_OIDC_ADMIN_GROUPS:}
  audit-alert:
    enabled: ${APP_AUDIT_ALERT_ENABLED:false}
    webhook-url: ${APP_AUDIT_ALERT_WEBHOOK_URL:}
    signing-secret: ${APP_AUDIT_ALERT_SIGNING_SECRET:}
    timeout-seconds: ${APP_AUDIT_ALERT_TIMEOUT_SECONDS:5}
    cooldown-seconds: ${APP_AUDIT_ALERT_COOLDOWN_SECONDS:30}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  file:
    name: ./logs/mydatadev.log
